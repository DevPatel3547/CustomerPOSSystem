# Local stack: PostgreSQL + Express API + React front end.
#   docker compose up --build
#   front end http://localhost:3000, API http://localhost:9000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
      POSTGRES_DB: pos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      PSQL_HOST: db
      PSQL_PORT: "5432"
      PSQL_USER: pos
      PSQL_PASSWORD: pos
      PSQL_DATABASE: pos
      PSQL_SSL: "false"
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./my-react-app
      args:
        REACT_APP_API_URL: http://localhost:9000
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
