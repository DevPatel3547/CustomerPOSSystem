name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API tests (unit + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      POS_INTEGRATION: "1"
      PSQL_HOST: localhost
      PSQL_PORT: "5432"
      PSQL_USER: pos
      PSQL_PASSWORD: pos
      PSQL_DATABASE: pos
      PSQL_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm test

  web:
    name: Front end tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-react-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-react-app/package-lock.json
      - run: npm ci
      - run: npx react-scripts test --watchAll=false --forceExit
        env:
          CI: "true"
      - run: npm run build
        env:
          CI: "false"

  docker:
    name: Docker compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d db api
      - name: API answers through the ORM against the compose database
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/ >/dev/null; then break; fi
            sleep 2
          done
          docker compose exec -T db psql -U pos -d pos -c "CREATE TABLE menu (name_of_item TEXT PRIMARY KEY, cost_of_item NUMERIC(6,2));"
          curl -fsS -X POST http://localhost:9000/insertInto -H 'Content-Type: application/json' \
            -d '{"table":"menu","name_of_item":"Orange Lulu","cost_of_item":"5.25"}'
          curl -fsS http://localhost:9000/getTable/menu | tee out.json
          grep -q 'Orange Lulu' out.json
      - if: always()
        run: docker compose logs api
      - if: always()
        run: docker compose down -v
